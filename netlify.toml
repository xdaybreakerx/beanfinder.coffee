[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "26.10.0"

# The Netlify Vite plugin treats the Astro app directory as its repository root.
[context.dev]
  base = "."
