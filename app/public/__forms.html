<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!-- Keep field names in sync with src/components/RoasterForm.astro. -->
    <form name="roaster-form" method="POST" action="/__forms" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="roaster-form" />
      <input name="subject" />
      <input name="bot-field" />
      <input name="submission-type" />
      <input name="roaster-name" />
      <input name="roaster-website" />
      <input name="original-website" />
      <input name="state" />
      <input name="has-cafe" />
      <input name="multi-roaster" />
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
